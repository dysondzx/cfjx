version: '3.8'

services:
  # 后端应用服务（开发模式）
  backend:
    build: .
    container_name: cfjx-backend-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      # 数据库配置
      - DB_HOST=host.docker.internal
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=cfjx_db
      # Redis配置
      - REDIS_URL=redis://host.docker.internal:6379
      # 智能客服与 AIGC 服务
      - AI_SERVICE_URL=http://ai-service:8000
      - AIGC_IMAGE_QUOTA=${AIGC_IMAGE_QUOTA:-5}
      - AIGC_VIDEO_QUOTA=${AIGC_VIDEO_QUOTA:-1}
    volumes:
      - .:/app  # 挂载代码目录，支持热重载
      - /app/node_modules  # 避免覆盖容器内的node_modules
    restart: unless-stopped
    networks:
      - cfjx-dev-network

  # 智能客服 AI 服务（开发模式）
  ai-service:
    build: ../ai-service
    container_name: cfjx-ai-service-dev
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=https://api.deepseek.com
      - LLM_MODEL=deepseek-chat
      - EMBEDDING_MODEL=BAAI/bge-small-zh-v1.5
      - CHROMA_DIR=./data/chroma
      # 数据库配置（订单查询）
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=cfjx_db
      # 火山方舟 AIGC（Seedream 生图 / Seedance 生视频）
      - ARK_API_KEY=${ARK_API_KEY}
      - ARK_BASE_URL=https://ark.cn-beijing.volces.com/api/v3
      - ARK_IMAGE_MODEL=${ARK_IMAGE_MODEL:-doubao-seedream-4-0-250828}
      - ARK_VIDEO_MODEL=${ARK_VIDEO_MODEL:-doubao-seedance-1-0-pro-250528}
      - AIGC_OUTPUT_DIR=./data/outputs
    volumes:
      - ../ai-service/data:/app/data
    restart: unless-stopped
    networks:
      - cfjx-dev-network

# 网络定义
networks:
  cfjx-dev-network:
    driver: bridge