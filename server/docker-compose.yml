version: '3.8'

services:
  # 后端应用服务
  backend:
    build: .
    container_name: cfjx-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # 数据库配置
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=cfjx_db
      # Redis配置
      - REDIS_URL=redis://redis:6379
      # 智能客服AI服务
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - mysql
      - redis
      - ai-service
    restart: unless-stopped
    networks:
      - cfjx-network

  # MySQL数据库服务
  mysql:
    image: mysql:8.0
    container_name: cfjx-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=cfjx_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql.txt:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - cfjx-network

  # Redis缓存服务
  redis:
    image: redis:7-alpine
    container_name: cfjx-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - cfjx-network

  # 智能客服 AI 服务（Python + LangChain/LangGraph + RAG）
  ai-service:
    build: ../ai-service
    container_name: cfjx-ai-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=https://api.deepseek.com
      - LLM_MODEL=deepseek-chat
      - EMBEDDING_MODEL=BAAI/bge-small-zh-v1.5
      - CHROMA_DIR=./data/chroma
      # 数据库配置（订单查询）
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=cfjx_db
    volumes:
      - ../ai-service/data:/app/data
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - cfjx-network

# 数据卷定义
volumes:
  mysql_data:
  redis_data:

# 网络定义
networks:
  cfjx-network:
    driver: bridge